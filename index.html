 h+=sec("กราฟ: จำนวนกล่องรายวัน แยกตามทะเบียนรถ",`<div class="m"><span style="color:#2f6fe4">■</span> ${PL[0]} &nbsp;<span style="color:#7fb0ff">■</span> ${PL[1]}</div><div class="bars">${D.map((v,i)=>`<div title="วันที่ ${i+1}: ${PL[0]} ${v[0]} / ${PL[1]} ${v[1]} กล่อง"><u style="height:${v[1]/mx*88}%;background:#7fb0ff;border-radius:3px 3px 0 0"></u><u style="height:${v[0]/mx*88}%;border-radius:0"></u>${i+1}</div>`).join("")}</div>`);
 h+=sec("กราฟ: ต้นทุนรวมรายวัน (บาท)",`<div class="bars">${D.map((v,i)=>`<div title="วันที่ ${i+1}: ${f(v[2])} บาท"><u style="height:${v[2]/mc*88}%;background:#13408f"></u>${i+1}</div>`).join("")}</div>`);
 const pr=[["ค่ารถ",ta.car,"#13408f"],["ค่าแรง/OT/เบี้ยเลี้ยง",ta.pay,"#2f6fe4"],["ค่าน้ำมัน",ta.fuel,"#7fb0ff"],["ทางด่วน/จอด/อื่นๆ",ta.oth,"#b8cdf2"]];
 const sl=stAll(),sp=sl.filter(([k,x])=>okS(x)).length,pp=sl.length?Math.round(sp/sl.length*100):0;
 const pie=(it,ct)=>{const tot=it.reduce((q,x)=>q+x[1],0);if(!tot)return'<div class="m">ยังไม่มีข้อมูล</div>';let c=0;const g=it.map(x=>{const p=c;c+=x[1]/tot*100;return x[2]+" "+p+"% "+c+"%"}).join(",");
  return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${g});display:flex;align-items:center;justify-content:center"><div style="width:78px;height:78px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:13px">${ct}</div></div><div>${it.map(x=>`<div><span style="color:${x[2]}">■</span> ${x[0]} ${f(x[1])} (${Math.round(x[1]/tot*100)}%)</div>`).join("")}</div></div>`};
 const vb=[0,1].map(i=>sum(mr.filter(r=>r.pi===i)).box);
 h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px">`+sec("🥧 สัดส่วนต้นทุน",pie(pr,f(ta.cost)+"<br>บาท"))+sec("🥧 สัดส่วนกล่องตามทะเบียนรถ",pie([[PL[0],vb[0],"#2f6fe4"],[PL[1],vb[1],"#7fb0ff"]],f(vb[0]+vb[1])+"<br>กล่อง"))+sec("🥧 SLA ก่อน 15:00 น.",pie([["ผ่าน",sp,"var(--ok)"],["เกินเวลา/รอเวลา",sl.length-sp,"var(--bad)"]],pp+"%"))+`</div>`;
 h+=slaSec(stAll(),"มาตรฐานเวลาจัดส่งรายสถานที่ & SLA",true);
 if(!rs.length)h+=`<div class="sec"><div>ยังไม่มีข้อมูลเดือนนี้ (ถ้ามีข้อมูลเก่าใน Excel กดปุ่มนี้เพื่อโหลดเข้าระบบ) — <button class="btn p" onclick="imp()">นำเข้าข้อมูลกันยายน 2569 จาก Excel</button><span id="msg"></span></div></div>`;
 return h}
const TG="15:00";
const mins=(a,b)=>{if(!a||!b)return null;const x=a.split(":"),y=b.split(":");return (y[0]*60+ +y[1])-(x[0]*60+ +x[1])};
const okS=x=>!!x.fin&&x.fin<=TG;
const stAll=d=>Object.entries(S.stops).filter(([k,x])=>!d||x.date===d).sort((p,q)=>(p[1].date+(p[1].arr||""))<(q[1].date+(q[1].arr||""))?-1:1);
function slaSec(list,title,withDate){const tot=list.length,p=list.filter(([k,x])=>okS(x)).length,pct=tot?Math.round(p/tot*100):null;
 const rows=list.map(([k,x],i)=>{const m=mins(x.arr,x.fin);const st=!x.fin?'<span class="m">รอบันทึกเวลา</span>':okS(x)?'<span style="color:var(--ok)">✔ ผ่านมาตรฐาน (เสร็จก่อน 15:00 น.)</span>':'<span style="color:var(--bad)">✘ เกินเวลา</span>';
  return `<tr class="cl" onclick="editStop('${k}')"><td>${i+1}</td>${withDate?`<td>${bd(x.date)}</td>`:""}<td>${PL[x.pi]||""}</td><td style="text-align:left">${x.place||""}</td><td>${x.arr||"-"} น.</td><td>${x.fin||"-"} น.</td><td>${m==null?"-":m+" นาที"}</td><td>${st}</td></tr>`}).join("");
 return sec(title+" (เป้าหมาย: สำเร็จก่อน 15:00 น.)",`<table><tr><th>ลำดับ</th>${withDate?"<th>วันที่</th>":""}<th>ทะเบียนรถ</th><th>สถานที่จัดส่ง</th><th>เวลาลูกค้ามา (Arrived)</th><th>เวลาจบงาน (Finished)</th><th>ระยะเวลาลงสินค้า</th><th>สถานะ SLA</th></tr>${rows||'<tr><td colspan="8" class="m">ยังไม่มีข้อมูลเวลาจัดส่ง — บันทึกได้ที่แท็บ "คีย์ข้อมูล"</td></tr>'}</table>`)
 +`<div class="sec"><h2 style="display:flex;justify-content:space-between"><span>🎯 อัตราความสำเร็จ SLA ก่อน 15:00 น.</span><span>${pct==null?"-":pct+"%"}</span></h2><div class="m">ผ่าน ${p} จาก ${tot} สถานที่${tot-p?` · เกินเวลา/รอเวลา ${tot-p}`:""}</div></div>`}
function editStop(k){S.sf=S.stops[k];S.date=S.sf.date;S.v="entry";render()}
function goDay(d){S.date=d;S.v="day";render()}
function day(){
 const rs=rowsAll().filter(r=>r.date===S.date),t=sum(rs);
 const head=["รถ/พนักงาน","คนขับ","กล่อง","สถานที่","เที่ยว","กม.","ค่ารถ","ค่าแรง+OT+เบี้ยเลี้ยง","น้ำมัน","ทางด่วน","จอด","ต้นทุน"];
 const b=rs.map(r=>`<tr class="cl" onclick="S.pi=${r.pi};S.v='entry';render()"><td>${PL[r.pi]}</td><td>${r.name||""}</td><td>${n(r.box)}</td><td>${n(r.pl)}</td><td>${n(r.trip)}</td><td>${kmOf(r)}</td><td>${f(carOf(r))}</td><td>${f(n(r.wage)+n(r.ot)+n(r.al)+n(r.drv)+n(r.r2)+n(r.r3))}</td><td>${f(fuel(r))}</td><td>${f(r.toll)}</td><td>${f(r.park)}</td><td><b>${f(cost(r))}</b></td></tr>`).join("");
 return `<div class="sec"><div><label>เลือกวันที่</label><input type="date" value="${S.date}" onchange="S.date=this.value;if(S.ym!==S.date.slice(0,7)){S.ym=S.date.slice(0,7);sub()}else render()"></div></div>`+sec("สรุปรายวัน "+bd(S.date),`<div class="kp">${K("กล่อง",t.box)}${K("สถานที่",t.pl)}${K("เที่ยว",t.trip)}${K("กม.",t.km)}${K("ต้นทุนรวม (บาท)",f(t.cost))}</div><br><table><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr>${b||`<tr><td colspan="12" class="m">ยังไม่มีข้อมูลวันนี้</td></tr>`}</table>`)+slaSec(stAll(S.date),"SLA รายสถานที่ วันที่ "+bd(S.date),false)}
function entry(){

 const sf=S.sf||{},sI=(a,l,t,v)=>`<div><label>${l}</label><input id="${a}" type="${t}" value="${v??""}"></div>`;
 const sla=`<div class="sec"><h2>บันทึกเวลาจัดส่งรายสถานที่ (SLA ก่อน 15:00 น.)</h2><div><div class="f">${sI("sdt","วันที่","date",sf.date||S.date)}<div><label>ทะเบียนรถ</label><select id="spi">${PL.slice(0,2).map((a,j)=>`<option value="${j}" ${(sf.pi??0)===j?"selected":""}>${a}</option>`).join("")}</select></div>${sI("spl","สถานที่จัดส่ง","text",sf.place)}${sI("sar","เวลาลูกค้ามา (Arrived)","time",sf.arr)}${sI("sfn","เวลาจบงาน (Finished)","time",sf.fin)}</div>
 <p><button class="btn p" onclick="saveStop()">💾 บันทึกสถานที่</button> <button class="btn d" onclick="delStop()">ลบ</button> <button class="btn" onclick="S.sf=null;render()">ล้างฟอร์ม</button><span id="msg2"></span></p><p class="m">สถานะผ่านเมื่อเวลาจบงานไม่เกิน 15:00 น. · บันทึกซ้ำที่วัน/รถ/สถานที่เดิม = แก้ไขรายการเดิม · แตะแถวในตาราง SLA เพื่อโหลดมาแก้ไข</p></div></div>`;
 const k=S.pi,x=S.rows[id(S.date,k,"")]||S.rows[id(S.date,k,"a")]||{},dv={car:k<2?950:0,wage:426,ot:80,al:30,drv:50},g=a=>x[a]??dv[a]??"";
 const i=(a,l,t="number")=>`<div><label>${l}</label><input id="${a}" type="${t}" inputmode="decimal"${a==="name"?' list="dn"':""} value="${g(a)}"></div>`;
 return `<div class="sec"><h2>คีย์ข้อมูลรายวัน (บันทึกซ้ำที่วัน/รถเดิม = แก้ไขรายการเดิม)</h2><div><div class="f">
 <div><label>วันที่</label><input id="date" type="date" value="${S.date}" onchange="S.date=this.value;if(S.ym!==S.date.slice(0,7)){S.ym=S.date.slice(0,7);sub()}else render()"></div>
 <datalist id="dn">${[...new Set([...SEED.map(q=>q[2]),...rowsAll().map(r=>r.name)])].filter(Boolean).map(q=>`<option value="${q}">`).join("")}</datalist><div><label>ขับรถทะเบียน</label><select id="pi" onchange="S.pi=+this.value;render()">${PL.map((a,j)=>`<option value="${j}" ${j===k?"selected":""}>${a}</option>`).join("")}</select></div>
 ${i("name","ใครขับ (ชื่อคนขับ)","text")}${i("car","ค่ารถ (ยืนพื้น 950/วัน)")}${i("wage","ค่าแรง/วัน")}${i("ot","OT")}${i("al","เบี้ยเลี้ยง")}${i("drv","ค่าขับ")}${i("r2","รอบ 2")}${i("r3","รอบ 3")}
 ${i("box","จำนวนกล่อง")}${i("pl","จำนวนสถานที่")}${i("job","จำนวนใบงาน")}${i("trip","จำนวนเที่ยวรถ")}${i("ks","ไมล์เริ่ม")}${i("ke","ไมล์สิ้นสุด")}${i("tire","ค่าปะยาง")}${i("park","ค่าจอดรถ")}${i("toll","ค่าทางด่วน")}${i("oth","อื่นๆ (บาท)")}
 </div><p><button class="btn p" onclick="save()">💾 บันทึก</button> <button class="btn d" onclick="del()">ลบรายการ</button><span id="msg"></span></p>
 <p class="m">น้ำมันคำนวณอัตโนมัติ: (ไมล์สิ้นสุด − ไมล์เริ่ม) ÷ 8 กม./ลิตร × 39 บาท · ต้นทุน = ค่ารถ + ค่าแรง + OT + เบี้ยเลี้ยง + ค่าขับ + รอบ 2/3 + น้ำมัน + ปะยาง + จอด + ทางด่วน + อื่นๆ · "พนักงานเสริม" ใช้บันทึกคนขับที่ไม่มีรถ (ใส่แค่ค่าแรง/OT/เบี้ยเลี้ยง)</p></div></div>`+sla}
function rec(){const o={date:$("#date").value,pi:+$("#pi").value,name:$("#name").value};o.month=o.date.slice(0,7);
 ["car","wage","ot","al","drv","r2","r3","box","pl","job","trip","ks","ke","tire","park","toll","oth"].forEach(a=>o[a]=n($("#"+a).value));return o}
const msg=(t,e)=>{const m=$("#msg");if(m){m.style.color=e?"var(--bad)":"var(--ok)";m.textContent=t}};
async function save(){const o=rec();if(!o.date)return msg("เลือกวันที่ก่อน",1);
 try{if(S.db)await S.db.doc("trips/"+id(o.date,o.pi,"a")).set(o);else{S.rows[id(o.date,o.pi,"a")]=o;render()}msg("✓ บันทึกแล้ว")}catch(e){msg("บันทึกไม่ได้: "+(e.code||e.message)+" (ต้องมีสิทธิ์ Contributor ขึ้นไป)",1)}}
async function del(){const o=rec();try{if(S.db)await S.db.doc("trips/"+id(o.date,o.pi,"a")).delete();else{delete S.rows[id(o.date,o.pi,"a")];render()}msg("ลบแล้ว")}catch(e){msg("ลบไม่ได้",1)}}
async function imp(){if(!S.db)return msg("ต้องเปิดผ่านลิงก์ artifact เพื่อบันทึกลงฐานข้อมูล",1);
 try{for(let j=0;j<SEED.length;j++){const s=SEED[j],o={date:s[0],month:s[0].slice(0,7),pi:s[1],name:s[2],car:s[1]<2?950:0,wage:426,ot:80,al:30,drv:50,r2:s[3],r3:s[4],box:s[5],pl:s[6],job:s[7],ks:s[8],ke:s[9],trip:s[10],tire:s[11],park:s[12],toll:s[13],oth:s[14]};
  await S.db.doc("trips/"+id(o.date,o.pi,"a")).set(o);msg("กำลังนำเข้า "+(j+1)+"/"+SEED.length)}msg("✓ นำเข้าครบแล้ว")}catch(e){msg("นำเข้าไม่สำเร็จ: "+(e.code||e.message),1)}}

const hs=t=>{let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const msg2=(t,e)=>{const m=$("#msg2");if(m){m.style.color=e?"var(--bad)":"var(--ok)";m.textContent=" "+t}};
function stRec(){const d=$("#sdt").value,o={date:d,month:d.slice(0,7),pi:+$("#spi").value,place:$("#spl").value.trim(),arr:$("#sar").value,fin:$("#sfn").value};return[o,"stops/"+d+"_"+o.pi+"_"+hs(o.place)]}

 try{if(S.db)await S.db.doc(p).set(o);else{S.stops[p.slice(6)]=o;render()}S.sf=null;msg2("✓ บันทึกแล้ว")}catch(e){msg2("บันทึกไม่ได้: "+(e.code||e.message),1)}}
async function delStop(){const[o,p]=stRec();try{if(S.db)await S.db.doc(p).delete();else{delete S.stops[p.slice(6)];render()}S.sf=null;msg2("ลบแล้ว")}catch(e){msg2("ลบไม่ได้",1)}}
function render(){tabs();$("#v").innerHTML=S.v==="month"?month():S.v==="day"?day():entry();if(S.v!=="month"){const[y,m]=S.ym.split("-").map(Number);$("#sub").textContent="ประจำเดือน "+MN[m-1]+" "+(y+543)}}
S.ym="2026-09";S.date="2026-09-01";render();init();
